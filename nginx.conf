server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker must never be cached for long, or updates would not reach phones.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
